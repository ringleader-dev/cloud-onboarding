AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Ringleader AWS onboarding (OIDC federation, keyless). Creates an IAM OIDC identity
  provider trusting Ringleader's per-org issuer, an IAM role Ringleader assumes via
  AssumeRoleWithWebIdentity (trust pinned to your org's aud AND sub, permissions limited
  to the EC2 workstation lifecycle), and optionally a public-subnet landing-pad network.

# About the two condition keys: CloudFormation cannot build an object key from a parameter,
# and the IAM trust-policy condition keys are "<issuer-host+path>:aud" and ":sub", which
# embed your org. So this template carries the placeholder __OIDC_PROVIDER__ in exactly those
# two keys, and deploy.sh substitutes your issuer host+path (e.g.
# oidc-app.ringleader.dev/org/<org-id>) before running `aws cloudformation deploy`. Deploying
# by hand? Replace __OIDC_PROVIDER__ first. Everything else is a real parameter.

Parameters:
  IssuerUrl:
    Type: String
    Description: >-
      Your org-specific issuer: <ringleader-issuer-origin>/org/<org-id>, e.g.
      https://oidc-app.ringleader.dev/org/<org-id>. This is the OIDC provider Url and
      the assertion's iss claim.
    AllowedPattern: "^https://[a-zA-Z0-9.-]+/org/[0-9a-f-]{36}$"

  Audience:
    Type: String
    Description: >-
      The OIDC client id (the assertion's aud claim): <IssuerUrl>/aws.
    AllowedPattern: "^https://[a-zA-Z0-9.-]+/org/[0-9a-f-]{36}/aws$"

  Subject:
    Type: String
    Description: "The assertion's sub claim: org:<org-id>."
    AllowedPattern: "^org:[0-9a-f-]{36}$"

  # HARDCODED DEFAULT, and deliberately safe to let go stale. Creating an IAM OIDC provider
  # requires a ThumbprintList, but since 2023 AWS validates an IdP served from a well-known
  # public CA against its own trust store and IGNORES this value -- so onboarding still
  # succeeds if Ringleader's issuer moves to a different CA. deploy.sh always overrides it
  # with the value it computes from the live TLS chain, so this default is reached only by a
  # by-hand deploy that passes no Thumbprint. See README.md -> "About the Thumbprint default"
  # for how to compute your own.
  Thumbprint:
    Type: String
    Default: "08745487e891c19e3078c1f2a07e452950ef36f6"
    Description: >-
      SHA-1 thumbprint of the CA at the top of the issuer's TLS chain. AWS ignores it for an
      IdP served from a well-known public CA (Ringleader's issuer is), but the API requires
      the field. deploy.sh recomputes it from the live chain; this default is Google Trust
      Services Root R1, Ringleader's issuer CA at the time of writing.
    AllowedPattern: "^[0-9a-fA-F]{40}$"

  RoleName:
    Type: String
    Default: "ringleader-workstations"
    Description: "Name of the IAM role Ringleader assumes. Its ARN is what you hand back."

  AllowedRegion:
    Type: String
    Default: ""
    Description: >-
      Optional. If set, the role may only act in this region (aws:RequestedRegion). Empty
      places no region condition (the account is the boundary).

  CreateNetwork:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Create a VPC + public subnet + internet gateway + security group landing pad. On by
      default; set false and supply your own subnet and security group instead. The VPC,
      subnet, gateway and security group are free -- the NAT gateway below is not.

  VpcCidr:
    Type: String
    Default: "10.60.0.0/16"

  SubnetCidr:
    Type: String
    Default: "10.60.0.0/20"

  SshSourceCidr:
    Type: String
    Default: ""
    Description: >-
      A single CIDR allowed to SSH to workstations (when CreateNetwork=true). Empty opens
      no inbound rule (private reach only). rl shell/tmux/port-forwards all dial the
      workstation on 22 directly -- there is no bastion.

  SecondarySshSourceCidr:
    Type: String
    Default: ""
    Description: >-
      A single CIDR allowed to reach the secondary SSH port (TCP 2222) on the workstations
      security group. Empty opens no rule. deploy.sh defaults it to SshSourceCidr, so the two
      ports open to the same people unless you say otherwise; set SECONDARY_SSH_SOURCE_CIDR to
      "none" there to close it, or pass this parameter directly when deploying by hand. Some
      Ringleader workstation types run their own SSH daemon on that port inside the instance,
      beside the instance's own sshd on 22, and rl shell dials it instead of 22 for those;
      others never use it, and for those the rule is harmless.

  EnableEgressControl:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Let Ringleader manage the security groups that restrict where your workstations may
      connect. On by default; set false to opt out. It grants six security-group actions, a
      security-group-rules read and ec2:ModifyNetworkInterfaceAttribute, bounded to
      EgressVpcId (and to AllowedRegion, if set). Granting it restricts nothing on its own --
      until you declare an egress policy on a workstation, nothing changes.

  EgressVpcId:
    Type: String
    Default: ""
    Description: >-
      VPC the egress permissions are confined to. Leave empty when CreateNetwork=true and
      the VPC this stack creates is used. If you bring your own network, name it here --
      otherwise the permissions are bounded by region alone and reach every security group
      in it.

  CreateNatGateway:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Create a NAT gateway and a private route table, so anything on this VPC without a
      public IP still has egress. On by default, and the one default here that costs money --
      it bills per hour plus data processing whether or not anything uses it. Set false,
      along with CreateGatewaySubnet, if every workstation gets a public IP.

  CreateGatewaySubnet:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Reserve a private subnet for the DNS / HTTPS proxy VM that Ringleader's hostname-level
      egress control will use. On by default; set false to opt out. The VM is not built yet,
      so this creates an empty subnet, which AWS does not bill for. It turns CreateNatGateway
      on, because the proxy has no public IP and NAT is its only route out.

  GatewaySubnetCidr:
    Type: String
    Default: "10.60.240.0/24"
    Description: >-
      CIDR for the gateway subnet. Must sit inside VpcCidr; the default sits well clear of
      SubnetCidr so growing that subnet later does not collide.

Conditions:
  HasRegionCondition: !Not [!Equals [!Ref AllowedRegion, ""]]
  WantNetwork: !Equals [!Ref CreateNetwork, "true"]
  WantSsh: !And
    - !Condition WantNetwork
    - !Not [!Equals [!Ref SshSourceCidr, ""]]
  WantSecondarySsh: !And
    - !Condition WantNetwork
    - !Not [!Equals [!Ref SecondarySshSourceCidr, ""]]
  WantAnyInbound: !Or [!Condition WantSsh, !Condition WantSecondarySsh]
  WantEgressControl: !Equals [!Ref EnableEgressControl, "true"]
  HasEgressVpc: !Not [!Equals [!Ref EgressVpcId, ""]]
  HasAnyEgressVpc: !Or [!Condition HasEgressVpc, !Condition WantNetwork]
  WantGatewaySubnet: !And
    - !Condition WantNetwork
    - !Equals [!Ref CreateGatewaySubnet, "true"]
  # A gateway subnet has no public IP, so it implies the NAT gateway.
  WantNat: !And
    - !Condition WantNetwork
    - !Or
      - !Equals [!Ref CreateNatGateway, "true"]
      - !Equals [!Ref CreateGatewaySubnet, "true"]

Resources:
  RingleaderOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: !Ref IssuerUrl
      ClientIdList:
        - !Ref Audience
      ThumbprintList:
        - !Ref Thumbprint

  RingleaderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: "Least-privilege role Ringleader federates into to manage workstation EC2 instances."
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RingleaderOrgFederation
            Effect: Allow
            Principal:
              Federated: !Ref RingleaderOidcProvider
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                # deploy.sh replaces __OIDC_PROVIDER__ with your issuer host+path.
                "__OIDC_PROVIDER__:aud": !Ref Audience
                "__OIDC_PROVIDER__:sub": !Ref Subject
      Policies:
        - PolicyName: ringleader-workstations
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Ec2Describe
                Effect: Allow
                Action:
                  - "ec2:DescribeInstances"
                  - "ec2:DescribeInstanceStatus"
                  - "ec2:DescribeInstanceTypes"
                  - "ec2:DescribeImages"
                  - "ec2:DescribeSubnets"
                  - "ec2:DescribeSecurityGroups"
                  - "ec2:DescribeVpcs"
                  - "ec2:DescribeVolumes"
                  - "ec2:DescribeNetworkInterfaces"
                  - "ec2:DescribeTags"
                  - "ec2:DescribeAvailabilityZones"
                Resource: "*"
              - Sid: Ec2Lifecycle
                Effect: Allow
                Action:
                  - "ec2:RunInstances"
                  - "ec2:TerminateInstances"
                  - "ec2:StartInstances"
                  - "ec2:StopInstances"
                  - "ec2:CreateTags"
                  - "ec2:DeleteTags"
                Resource: "*"
                Condition: !If
                  - HasRegionCondition
                  - StringEquals:
                      "aws:RequestedRegion": !Ref AllowedRegion
                  - !Ref AWS::NoValue
              - Sid: SsmPublicParameterRead
                Effect: Allow
                Action:
                  - "ssm:GetParameters"
                  - "ssm:GetParameter"
                # ${AWS::Partition}, not a literal "aws": the same template then works in
                # GovCloud (aws-us-gov) and China (aws-cn), where a hardcoded partition yields a
                # policy that is valid and matches nothing.
                Resource: !Sub "arn:${AWS::Partition}:ssm:*::parameter/aws/service/*"

              # Egress control, when EnableEgressControl=true. Ringleader compiles each distinct
              # egress policy into ONE security group and attaches it to the workstations
              # carrying that policy, so a fleet sharing a policy costs one group -- which
              # matters, because AWS caps an ENI at 5 security groups and a region at 2,500.
              #
              # The ingress pair is for the DNS / HTTPS proxy VM, whose own group has to admit
              # workstation traffic.
              #
              # Bounded by VPC where one is known, since a VPC sits in exactly one region and is
              # the tighter of the two bounds; by AllowedRegion otherwise.
              - !If
                - WantEgressControl
                - Sid: EgressSecurityGroups
                  Effect: Allow
                  Action:
                    - "ec2:DescribeSecurityGroupRules"
                    - "ec2:CreateSecurityGroup"
                    - "ec2:DeleteSecurityGroup"
                    - "ec2:AuthorizeSecurityGroupEgress"
                    - "ec2:RevokeSecurityGroupEgress"
                    - "ec2:AuthorizeSecurityGroupIngress"
                    - "ec2:RevokeSecurityGroupIngress"
                  Resource: "*"
                  Condition: !If
                    - HasAnyEgressVpc
                    - StringLike:
                        "ec2:Vpc": !If
                          - HasEgressVpc
                          - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc/${EgressVpcId}"
                          - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc/${Vpc}"
                    - !If
                      - HasRegionCondition
                      - StringEquals:
                          "aws:RequestedRegion": !Ref AllowedRegion
                      - !Ref AWS::NoValue
                - !Ref AWS::NoValue

              # The other half: moving a workstation's NIC onto the security group its policy
              # compiled to, which is what makes a policy change take effect on a running
              # workstation rather than only on the next one created.
              - !If
                - WantEgressControl
                - Sid: EgressAttachToInstances
                  Effect: Allow
                  Action: "ec2:ModifyNetworkInterfaceAttribute"
                  Resource: "*"
                  Condition: !If
                    - HasAnyEgressVpc
                    - StringLike:
                        "ec2:Vpc": !If
                          - HasEgressVpc
                          - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc/${EgressVpcId}"
                          - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc/${Vpc}"
                    - !If
                      - HasRegionCondition
                      - StringEquals:
                          "aws:RequestedRegion": !Ref AllowedRegion
                      - !Ref AWS::NoValue
                - !Ref AWS::NoValue

  # --- Optional landing-pad network -----------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Condition: WantNetwork
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: ringleader-workstations }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: WantNetwork
    Properties:
      Tags: [{ Key: Name, Value: ringleader-workstations }]

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: WantNetwork
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  Subnet:
    Type: AWS::EC2::Subnet
    Condition: WantNetwork
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref SubnetCidr
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: ringleader-workstations }]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Condition: WantNetwork
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: ringleader-workstations }]

  DefaultRoute:
    Type: AWS::EC2::Route
    Condition: WantNetwork
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  SubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: WantNetwork
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable

  # NAT gateway, for anything on this VPC without a public IP: a workstation created with
  # providerConfig.aws.assignPublicIp: false, and the gateway subnet below. It lives in the
  # public subnet (that is where a NAT gateway has to be) and is reached through the private
  # route table, which is what actually gives a private instance egress. Bills per hour plus
  # data processing.
  NatEip:
    Type: AWS::EC2::EIP
    Condition: WantNat
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: ringleader-nat }]

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: WantNat
    DependsOn: VpcGatewayAttachment
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref Subnet
      Tags: [{ Key: Name, Value: ringleader-workstations }]

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: WantNat
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: ringleader-private }]

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Condition: WantNat
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway

  # A home for the future DNS / HTTPS proxy VM -- created empty, and only if you ask.
  #
  # Ringleader's egress control can point workstations at a proxy that resolves names and
  # terminates HTTPS for the hosts you allow. That VM is not built yet, but where it will live
  # is worth settling now: a subnet of its own means the security-group rules that permit
  # workstation -> proxy traffic can name one stable range instead of one instance's address,
  # and carving the range now avoids renumbering later.
  #
  # It shares the workstations subnet's availability zone, because AWS charges for cross-AZ
  # traffic in both directions and a proxy sits on the path of everything a workstation does.
  GatewaySubnet:
    Type: AWS::EC2::Subnet
    Condition: WantGatewaySubnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref GatewaySubnetCidr
      AvailabilityZone: !GetAtt Subnet.AvailabilityZone
      Tags: [{ Key: Name, Value: ringleader-gateway }]

  GatewaySubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: WantGatewaySubnet
    Properties:
      SubnetId: !Ref GatewaySubnet
      RouteTableId: !Ref PrivateRouteTable

  WorkstationsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: WantNetwork
    Properties:
      GroupName: ringleader-workstations
      # Do NOT restate the ingress list here as it grows: GroupDescription requires REPLACEMENT,
      # so editing it swaps the security group for a new one with a new id -- the id you handed
      # back to Ringleader (providerConfig.aws.securityGroupIds). SecurityGroupIngress below is
      # the authority on what is actually open.
      GroupDescription: "Ringleader workstations: egress out; inbound SSH only from SshSourceCidr."
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
          Description: "All egress (a workstation reaching the Ringleader control plane)."
      # 2222 is the SECONDARY SSH port, fixed by Ringleader and deliberately not a parameter:
      # you never have to know the number, and it cannot drift from the port Ringleader dials.
      # With both CIDRs empty this property resolves away entirely, so a stack deployed on the
      # defaults admits exactly what it admitted before SecondarySshSourceCidr existed.
      SecurityGroupIngress: !If
        - WantAnyInbound
        - - !If
            - WantSsh
            - IpProtocol: tcp
              FromPort: 22
              ToPort: 22
              CidrIp: !Ref SshSourceCidr
              Description: "SSH from your ranges."
            - !Ref AWS::NoValue
          - !If
            - WantSecondarySsh
            - IpProtocol: tcp
              FromPort: 2222
              ToPort: 2222
              CidrIp: !Ref SecondarySshSourceCidr
              Description: "Secondary SSH port, for workstation types that run their own SSH daemon."
            - !Ref AWS::NoValue
        - !Ref AWS::NoValue
      Tags: [{ Key: Name, Value: ringleader-workstations }]

Outputs:
  TargetRoleArn:
    Description: "Hand back to Ringleader: spec.aws.targetRoleArn on the CloudAccount."
    Value: !GetAtt RingleaderRole.Arn
  OidcProviderArn:
    Description: "The IAM OIDC provider ARN (for your reference)."
    Value: !Ref RingleaderOidcProvider
  SubnetId:
    Condition: WantNetwork
    Description: "providerConfig.aws.subnetId."
    Value: !Ref Subnet
  SecurityGroupId:
    Condition: WantNetwork
    Description: "providerConfig.aws.securityGroupIds."
    Value: !GetAtt WorkstationsSecurityGroup.GroupId
  VpcId:
    Condition: WantNetwork
    Description: >-
      The VPC this stack created. Also the VPC the egress permissions are bounded to, when
      EnableEgressControl=true and EgressVpcId was left empty.
    Value: !Ref Vpc
  GatewaySubnetId:
    Condition: WantGatewaySubnet
    Description: "Private subnet reserved for the future DNS / HTTPS proxy VM."
    Value: !Ref GatewaySubnet
  PrivateRouteTableId:
    Condition: WantNat
    Description: >-
      Route table sending 0.0.0.0/0 to the NAT gateway. Associate any subnet that should
      reach the internet without a public IP with it.
    Value: !Ref PrivateRouteTable
